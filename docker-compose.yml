version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bk_delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-bk_delivery}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bk_delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bk_network

  redis:
    image: redis:7-alpine
    container_name: bk_delivery_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bk_delivery_backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-bk_delivery}
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET:-bk_delivery_super_secret_jwt_key_2026_enterprise_secure!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bk_delivery_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bk_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bk_network:
    driver: bridge
